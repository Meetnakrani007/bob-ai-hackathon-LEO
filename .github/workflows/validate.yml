name: Validate Submission

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        python-version: ["3.11"]

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Backend
      - name: Install backend dependencies
        working-directory: src/backend
        run: npm ci

      - name: Lint backend
        working-directory: src/backend
        run: npm run lint --if-present

      - name: Test backend
        working-directory: src/backend
        run: npm test --if-present
        env:
          MONGODB_URI: mongodb://localhost:27017/supplyguard_test
          JWT_ACCESS_SECRET: test-access-secret-for-ci
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci
          REDIS_URL: redis://localhost:6379
          PYTHON_SERVICE_URL: http://localhost:8000
          NODE_ENV: test

      # Python
      - name: Install Python dependencies
        working-directory: src/python
        run: pip install -r requirements.txt

      - name: Test Python
        working-directory: src/python
        run: pytest --tb=short -q
        env:
          MONGODB_URI: mongodb://localhost:27017/supplyguard_test
          REDIS_URL: redis://localhost:6379

      # Frontend
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint --if-present

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      # Submission validation
      - name: Validate submission.yaml exists
        run: test -f submission.yaml

      - name: Validate README exists
        run: test -f README.md

      - name: Check no secrets committed
        run: |
          if git log -p | grep -iE "sk-ant|mongodb\+srv://[^<]" | head -1; then
            echo "ERROR: Possible secrets found in git history!"
            exit 1
          fi
          echo "No secrets found ✓"
